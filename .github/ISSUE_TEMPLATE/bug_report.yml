name: Bug report
description: Report a reproducible problem with a command or installation.
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, PowerShell version, .NET SDK version, and dnet version.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the exact command and a minimal project layout. Omit secrets.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
